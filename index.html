<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebox</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <div class="auth-layout">
      <section class="brand" aria-label="Facebox introduction">
        <h1 class="brand-name">facebox</h1>
        <p class="brand-copy">Facebox helps you connect and share with the people in your life.</p>
        <div class="recent-label">
          <strong>Recent Logins</strong>
          <span>Click a profile or add an account.</span>
        </div>
        <button class="recent-account" type="button" data-open-signup>
          <span class="avatar">+</span>
          <span class="account-name">Add account</span>
        </button>
      </section>

      <section class="login-card" aria-label="Log in">
        <form data-login-form novalidate>
          <div class="form-group">
            <input class="field" type="text" name="identity" placeholder="Email or phone number" autocomplete="username">
          </div>
          <div class="form-group password-wrap">
            <input class="field" type="password" name="password" placeholder="Password" autocomplete="current-password">
            <button class="password-toggle" type="button" data-password-toggle aria-label="Show password">Show</button>
          </div>
          <button class="btn btn-primary" type="submit">Log in</button>
          <p class="form-message" data-form-message aria-live="polite"></p>
          <a class="text-link forgot-link" href="forgetp.html">Forgot password?</a>
          <hr class="divider">
          <div class="create-row">
            <button class="btn btn-success" type="button" data-open-signup>Create new account</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">🌙</button>

  <div class="modal-backdrop" data-signup-modal aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="signup-title">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 id="signup-title">Sign Up</h2>
          <p>It’s quick and easy.</p>
        </div>
        <button class="modal-close" type="button" data-close-modal aria-label="Close">&times;</button>
      </div>
      <form class="modal-body" data-signup-form novalidate>
        <div class="name-fields">
          <div class="form-group"><input class="field" type="text" name="firstName" placeholder="First name" required></div>
          <div class="form-group"><input class="field" type="text" name="lastName" placeholder="Surname" required></div>
        </div>
        <div class="form-group"><input class="field" type="text" name="identity" placeholder="Mobile number or email" required></div>
        <div class="form-group password-wrap">
          <input class="field" type="password" name="password" placeholder="New password" required>
          <button class="password-toggle" type="button" data-password-toggle aria-label="Show password">Show</button>
        </div>
        <button class="btn btn-success" type="submit">Sign Up</button>
      </form>
    </div>
  </div>
</body>
</html>
