<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Facebox</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body class="recovery-page">
  <header class="recovery-header">
    <a class="brand brand-name text-link" href="index.html" style="text-decoration:none">facebox</a>
    <form class="header-login" data-login-form novalidate>
      <input class="field" type="text" name="identity" placeholder="Email or phone">
      <input class="field" type="password" name="password" placeholder="Password">
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
  </header>

  <main class="recovery-main">
    <section class="recovery-card" aria-labelledby="recovery-title">
      <h1 id="recovery-title">Find Your Account</h1>
      <form class="recovery-body" data-recovery-form novalidate>
        <p>Enter your email or mobile number to search for your account.</p>
        <div class="form-group">
          <input class="field" type="text" name="recovery" placeholder="Email or mobile number" autocomplete="email">
        </div>
        <p class="form-message" data-form-message aria-live="polite"></p>
        <div class="recovery-actions">
          <a class="btn btn-secondary" href="index.html" style="display:inline-grid;place-items:center;text-decoration:none">Cancel</a>
          <button class="btn btn-primary" type="submit">Search</button>
        </div>
      </form>
    </section>
  </main>

  <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">🌙</button>
</body>
</html>
